name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - name: pytest (with coverage ≥ 80%)
        run: |
          uv run pytest -x -q \
            --cov=src --cov=qa --cov=scripts \
            --cov-fail-under=14   # TODO: raise to 80 as src/pipeline tests land \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

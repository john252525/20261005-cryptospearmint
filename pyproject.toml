[project]
name = "trading-desk"
version = "0.1.0"
description = "Trading desk monorepo: dev -> paper -> small live"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "polars>=1.0",
    "scipy>=1.12",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "plotly>=5.22,<6",
    "nautilus_trader>=1.190",
    "websockets>=12.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "prometheus-client>=0.20",
    "python-telegram-bot>=21.0",
    "ccxt>=4.5.85",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
]


# vectorbt 1.0.0 deadlock'ает в Portfolio.from_signals на numpy>=2.2/numba 0.68.
# Движок бэктеста по умолчанию — pandas. vectorbt — опционально:
#     uv sync --extra vbt
[project.optional-dependencies]
vbt = [
    "vectorbt>=0.26,<1.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "backtest", "journal", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "strict"

# ── Tech-debt freeze (2026-10-06). Не блокируем CI на этих файлах:
#    разберём отдельным PR. Все правила — стилистические.
[tool.ruff.lint.per-file-ignores]
"qa/honesty_checks.py"          = ["E501", "UP035", "B905", "RUF007"]
"qa/hourly_reconcile.py"        = ["E701", "E702", "E741", "E731", "B904", "RUF100"]
"scripts/qa_daily_report.py"    = ["B007", "E741"]
"src/execution/exchanges.py"    = ["RUF022"]
"src/execution/live_funding_daemon.py" = ["SIM105", "F401"]

# ── mypy scope freeze. Эти модули прошли review под mypy strict=false,
#    но содержат нетипизированные dict'ы и legacy-импорты. Разберём
#    отдельными задачами, сейчас не блокируем CI.
[[tool.mypy.overrides]]
module = ["qa.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.data.fetch", "src.data.fetch_funding"]
ignore_errors = true

[project]
name = "trading-desk"
version = "0.1.0"
description = "Trading desk pipeline: data → research → backtest → paper → live"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "pandas>=2.2,<3",
    "polars>=1.0",
    "numpy>=1.26,<2.3",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "ccxt>=4.5.85",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "backtest", "backtest_funding", "journal", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008 typer.Option() в default — известный FP; defensive broad-except — намеренно
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Оборона: сетевые адаптеры и I/O-код ловят широкие исключения осознанно
"src/pipeline/*.py"                = ["BLE001", "S110", "S112", "PLW1510"]
"scripts/data_audit.py"            = ["BLE001", "S110"]
"src/qa/*.py"                      = ["BLE001", "S110", "S112", "SIM115",
                                      "PERF102", "RUF007", "PLR0124"]
"src/strategies/funding_carry/*.py" = ["BLE001", "SIM103", "PLR0124"]
"src/execution/*.py"               = ["BLE001", "S110"]
"tests/*.py"                       = ["RUF059"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores   = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["ccxt", "pandas", "typer", "src.risk.kill_switch", "qa.*", "src.qa.*"]
ignore_missing_imports = true
ignore_errors          = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths  = ["tests"]
pythonpath = ["."]
addopts    = "-q --strict-markers --strict-config"
asyncio_mode = "strict"

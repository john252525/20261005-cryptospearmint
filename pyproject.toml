[project]
name = "trading-desk"
version = "0.1.0"
description = "Trading desk pipeline: data → research → backtest → paper → live"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "pandas>=2.2,<3",
    "polars>=1.0",
    "numpy>=1.26,<2.3",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "ccxt>=4.5.85",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "data",
    "backtest",
    "backtest_funding",
    "journal",
    "notebooks",
    "src/strategies",
    "src/qa",
    "src/execution",
    "src/report",
    "src/paper",
    "scripts/qa_daily_report.py",
    "tests/test_backtest.py",
    "tests/test_gates.py",
    "tests/test_honesty.py",
    "tests/test_portfolio.py",
    "tests/test_signal.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
    "ccxt",
    "prometheus_client",
    "pandas",
    "typer",
    "src.risk.kill_switch",
    "qa.*",
    "src.qa.*",
    "src.strategies.*",
    "src.execution.*",
    "src.report.*",
    "src.paper.*",
,
          "src.monitoring.*",
          "src.data.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "strict"

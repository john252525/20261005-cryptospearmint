env: paper
data:
  source: binance_futures
  symbols: [BTCUSDT]
  interval: 1h
  start: "2025-10-06"
  end:   "2026-10-06"
strategy:
  name: funding_carry
  params:
    lookback:  21
    entry_thr: 0.00005    # половина baseline BTC (0.01%/8h); входим когда устойчиво положительно
    exit_thr: -0.00003    # выходим только при инверсии funding в минус
    stat: median
backtest:
  init_cash: 100000
  spot_fee: 0.0010
  perp_fee: 0.0005
  deploy_ratio: 0.9

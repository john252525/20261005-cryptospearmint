env: paper
data:
  source: binance_futures
  symbols: [BTCUSDT]
  interval: 1h
  start: "2025-10-06"
  end:   "2026-10-06"
strategy:
  name: funding_carry
  params:
    lookback:  21
    entry_thr: 0.00010    # 1.0 bps / 8h — держимся в позиции только когда funding явно высокий
    exit_thr:  0.00002    # 0.2 bps / 8h — выходим как только ставка спала
    stat: median
backtest:
  init_cash: 100000
  spot_fee: 0.0010
  perp_fee: 0.0005
  deploy_ratio: 0.9

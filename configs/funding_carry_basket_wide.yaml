env: paper
data:
  source: binance_futures
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
  interval: 1h
  start: "2025-10-06"
  end:   "2026-10-06"
strategy:
  name: funding_carry
  params:
    lookback:  21
    entry_thr: 0.00020         # 2 bps — редко пересекается, но когда пересекается — устойчиво
    exit_thr:  0.0             # выходим, только когда funding ушёл в отрицательный
    stat: median
backtest:
  init_cash: 500000
  spot_fee: 0.0010
  perp_fee: 0.0005
  deploy_ratio: 0.9
